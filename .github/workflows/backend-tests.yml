name: Backend tests

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leafai
          POSTGRES_PASSWORD: leafai
          POSTGRES_DB: leafai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leafai" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONIOENCODING: utf-8
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://leafai:leafai@localhost:5432/leafai_test' || 'sqlite:///./data/leafai.db' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: Run tests
        run: python -m pytest -q --cov=app --cov-report=term
