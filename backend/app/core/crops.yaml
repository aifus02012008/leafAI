# ---------------------------------------------------------------------------
# Cấu hình cây trồng & mô hình nhận diện bệnh lá
# ---------------------------------------------------------------------------
# - Một cây trồng "khả dụng" khi file weights của nó tồn tại (hoặc model được
#   đăng ký thủ công). Chỉ cần thả file .pt vào đúng đường dẫn là cây được bật.
# - `weights` là đường dẫn tương đối tính từ thư mục gốc dự án. Có thể ghi đè
#   bằng biến môi trường MODEL_PATH_<CODE> (ví dụ MODEL_PATH_DURIAN).
# - Cây chè dùng `weights: settings` => lấy MODEL_PATH và bảng ngưỡng/nhãn cũ
#   trong app/core/config.py để giữ nguyên hành vi hiện tại.
# - `label_map`: nhãn thô của model -> tên bệnh chuẩn (phải trùng class_name
#   trong thư viện bệnh app/db/seed/<crop>.py).
#   ⚠️ Nhãn thô của sầu riêng/măng cụt/chôm chôm là DỰ KIẾN theo các bộ dữ
#   liệu công khai; cần chốt lại khi train xong model thật.
# ---------------------------------------------------------------------------

crops:
  - code: tea
    name_vi: Chè
    name_en: Tea
    scientific_name: Camellia sinensis
    weights: settings
    model_version: tea-yolo-v1

  - code: durian
    name_vi: Sầu riêng
    name_en: Durian
    scientific_name: Durio zibethinus
    weights: model/durian.pt
    model_version: durian-cls-v2  # YOLO11s-cls 288px, test acc 89.7%, Mendeley DOI 10.17632/pxzvksbwnj.5 (CC BY 4.0)
    img_size: 288
    base_confidence: 0.10
    default_threshold: 0.45
    healthy_threshold: 0.45
    healthy_labels: [Leaf_Healthy, Healthy, Healthy_leaf, No_Disease, no-disease]
    label_map:
      # Labels of the trained classifier (ml/configs/durian.yaml)
      Leaf_Algal: "Đốm rong sầu riêng (Durian algal leaf spot)"
      Leaf_Colletotrichum: "Thán thư sầu riêng (Durian anthracnose)"
      Leaf_Rhizoctonia: "Cháy lá chết ngọn sầu riêng (Durian Rhizoctonia leaf blight)"
      Leaf_Phomopsis: "Đốm lá Phomopsis sầu riêng (Durian Phomopsis leaf spot)"
      Leaf_Blight: "Cháy lá do Phytophthora trên sầu riêng (Durian Phytophthora leaf blight)"
      # Aliases kept for other datasets
      Leaf_Phytophthora: "Cháy lá do Phytophthora trên sầu riêng (Durian Phytophthora leaf blight)"
      Phytophthora: "Cháy lá do Phytophthora trên sầu riêng (Durian Phytophthora leaf blight)"
      Rhizoctonia: "Cháy lá chết ngọn sầu riêng (Durian Rhizoctonia leaf blight)"
      Anthracnose: "Thán thư sầu riêng (Durian anthracnose)"
      Algal_spot: "Đốm rong sầu riêng (Durian algal leaf spot)"
      Algal_Leaf_Spot: "Đốm rong sầu riêng (Durian algal leaf spot)"
      Psyllid: "Rầy phấn trắng hại sầu riêng (Durian psyllid)"

  - code: mangosteen
    name_vi: Măng cụt
    name_en: Mangosteen
    scientific_name: Garcinia mangostana
    weights: model/mangosteen.pt
    model_version: mangosteen-v1
    default_threshold: 0.30
    healthy_threshold: 0.35
    healthy_labels: [Healthy, Healthy_leaf, No_Disease, no-disease]
    label_map:
      Anthracnose: "Thán thư măng cụt (Mangosteen anthracnose)"
      Leaf_Spot: "Đốm lá Pestalotiopsis trên măng cụt (Mangosteen Pestalotiopsis leaf spot)"
      Pestalotiopsis: "Đốm lá Pestalotiopsis trên măng cụt (Mangosteen Pestalotiopsis leaf spot)"
      Algal_Leaf_Spot: "Đốm rong măng cụt (Mangosteen algal leaf spot)"
      Sooty_Mold: "Bồ hóng măng cụt (Mangosteen sooty mold)"

  - code: guava
    name_vi: Ổi
    name_en: Guava
    scientific_name: Psidium guajava
    weights: model/guava.pt
    # YOLO11s-cls: Mendeley DOI 10.17632/fspx44mwfp.1 (CC BY 4.0), original leaf photos only.
    model_version: guava-cls-v1
    img_size: 288
    base_confidence: 0.10
    default_threshold: 0.45
    healthy_threshold: 0.45
    healthy_labels: [Leaf_Healthy, Healthy]
    label_map:
      Leaf_Anthracnose: "Thán thư ổi (Guava anthracnose)"
      Leaf_Canker: "Loét lá ổi (Guava canker)"
      Leaf_Dot: "Đốm lá ổi (Guava leaf dot)"
      Leaf_Rust: "Gỉ sắt ổi (Guava rust)"

  - code: pomelo
    name_vi: Bưởi
    name_en: Pomelo
    scientific_name: Citrus maxima
    weights: model/pomelo.pt
    # YOLO11s-cls trained on citrus (lemon) leaves: Mendeley DOI 10.17632/smz8ffbthy.3 (CC BY 4.0).
    model_version: pomelo-cls-v1
    img_size: 288
    base_confidence: 0.10
    default_threshold: 0.45
    healthy_threshold: 0.45
    healthy_labels: [Leaf_Healthy, Healthy]
    label_map:
      Leaf_Anthracnose: "Thán thư bưởi (Pomelo anthracnose)"
      Leaf_Canker: "Loét lá bưởi (Citrus canker)"
      Leaf_Greening: "Vàng lá gân xanh bưởi (Citrus greening / HLB)"
      Leaf_Leafminer: "Sâu vẽ bùa hại bưởi (Citrus leafminer)"
      Leaf_Curl: "Xoăn lá bưởi do chích hút (Citrus leaf curl)"
      Leaf_Swallowtail: "Sâu xanh bướm phượng ăn lá bưởi (Swallowtail caterpillar)"

  - code: rambutan
    name_vi: Chôm chôm
    name_en: Rambutan
    scientific_name: Nephelium lappaceum
    weights: model/rambutan.pt
    model_version: rambutan-v1
    default_threshold: 0.30
    healthy_threshold: 0.35
    healthy_labels: [Healthy, Healthy_leaf, No_Disease, no-disease]
    label_map:
      Powdery-mildew: "Phấn trắng chôm chôm (Rambutan powdery mildew)"
      Powdery_Mildew: "Phấn trắng chôm chôm (Rambutan powdery mildew)"
      Anthracnose: "Thán thư chôm chôm (Rambutan anthracnose)"
      algal-fungal-disease: "Đốm rong chôm chôm (Rambutan algal leaf spot)"
      Algal_Leaf_Spot: "Đốm rong chôm chôm (Rambutan algal leaf spot)"
      Sooty_Mold: "Bồ hóng chôm chôm (Rambutan sooty mold)"
