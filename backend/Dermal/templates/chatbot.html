    <style>
        /* Reuse visual language from home.html */
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e8f0ff 100%);
        }

        .card-chat {
            width: 380px;
            max-width: 92vw;
            border: 0;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* let the card grow but not exceed viewport; keeps it centered and usable on mobile */
            height: min(86vh, 760px);
            margin: 12px auto;
        }

        /* Desktop: make the chat wider for better balance */
        @media (min-width: 1000px) {
            .card-chat {
                width: 720px;
                max-width: 80vw;
                height: min(80vh, 860px);
            }
        }

        .chat-header {
            padding: 16px;
            background: linear-gradient(90deg, #fff, #f7fbff);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand {
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .chat-body {
            /* flexible middle area: will take remaining card height */
            flex: 1 1 auto;
            min-height: 0;
            /* allow flex child to shrink correctly and enable scrolling */
            overflow-y: auto;
            padding: 16px;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bubble {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.3;
            box-shadow: 0 6px 18px rgba(13, 110, 253, 0.04);
        }

        .bubble.user {
            margin-left: auto;
            background: #0d6efd;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .bubble.bot {
            margin-right: auto;
            background: #f1f5fb;
            color: #0b1a36;
            border-bottom-left-radius: 4px;
        }

        .chat-input-row {
            padding: 12px;
            background: #ffffff;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            flex-shrink: 0;
            /* keep input row visible at bottom of card */
        }

        /* Reserve space so fixed bottom navbar doesn't cover the card input on small screens */
        body {
            padding-bottom: 76px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: linear-gradient(180deg, #f7fbff, #eef6ff);
            color: #0d6efd;
            font-size: 0.85rem;
            box-shadow: inset 0 -1px 0 rgba(13, 110, 253, 0.03);
            border: 1px solid rgba(13, 110, 253, 0.06);
        }

        /* ensure header content doesn't wrap awkwardly on wide layouts */
        .chat-header>div {
            min-width: 0;
        }
    </style>
</head>

<body class="d-flex vh-100">
    <div class="container d-flex align-items-center justify-content-center" style="min-height:100%;">
        <div class="card card-chat bg-white">
            <div class="chat-header">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="#0d6efd" class="me-2"
                    viewBox="0 0 16 16">
                    <path
                        d="M10.5 2a1 1 0 0 0-.832.445L8.94 4H7.06L6.332 2.445A1 1 0 0 0 5.5 2h-3A1.5 1.5 0 0 0 1 3.5v9A1.5 1.5 0 0 0 2.5 14h11A1.5 1.5 0 0 0 15 12.5v-9A1.5 1.5 0 0 0 13.5 2h-3zM8 12a3 3 0 1 1 0-6 3 3 0 0 1 0 6z" />
                </svg>
                <div style="flex: 1; min-width: 0;">
                    <div class="brand">LEAF_AI Trợ lý</div>
                    <div class="hint" style="font-size:0.85rem;color:#6b7280;">Hỏi kỹ sư AI powered by Gemini</div>
                </div>
                <div class="ms-auto d-flex align-items-center gap-2">
                    <!-- Hide Gemini chip on small screens (< 768px) to save space -->
                    <span class="chip d-none d-md-inline-flex" aria-hidden="true">Model: <strong
                            style="margin-left:6px;color:#0d6efd;">Gemini</strong></span>
                </div>
            </div>

            <div id="chatBody" class="chat-body">
                <!-- messages will be appended here -->
            </div>

            <!-- ensure CSRF cookie is set for the fetch() below -->
            <form class="d-none" aria-hidden="true">{% csrf_token %}</form>

            <div class="chat-input-row">
                <input id="messageInput" type="text" class="form-control"
                    placeholder="Nhập câu hỏi của bạn..." aria-label="Nhập câu hỏi"
                    style="flex:1 1 auto;border-top-left-radius:12px;border-bottom-left-radius:12px;" />
                <button id="sendBtn" class="btn btn-primary d-flex align-items-center justify-content-center"
                    title="Gửi" aria-label="Gửi"
                    style="width:48px;height:44px;border-top-right-radius:12px;border-bottom-right-radius:12px;padding:0;">
                    <!-- paper plane icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-send-fill" viewBox="0 0 16 16">
                        <path
                            d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.002.26.41a.5.5 0 0 0 .886-.083zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // simple client that posts user messages to a Django endpoint and displays responses
        const chatBody = document.getElementById('chatBody');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendBubble(text, who) {
            const el = document.createElement('div');
            el.className = 'bubble ' + (who === 'user' ? 'user' : 'bot');
            el.textContent = text;
            chatBody.appendChild(el);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            appendBubble(text, 'user');
            messageInput.value = '';
            appendBubble('Đang gửi...', 'bot');
            // POST to Django backend
            try {
                const resp = await fetch('{% url "chatbot_api" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest',
                        'X-CSRFToken': (function () {
                            const name = 'csrftoken=';
                            const cookies = document.cookie.split(';');
                            for (const c of cookies) {
                                const t = c.trim();
                                if (t.startsWith(name)) return t.substring(name.length);
                            }
                            return '';
                        })()
                    },
                    body: JSON.stringify({ message: text })
                });
                const data = await resp.json();
                // remove the 'Đang gửi...' placeholder (last bot bubble)
                const lastBot = [...chatBody.querySelectorAll('.bubble.bot')].pop();
                if (lastBot && lastBot.textContent === 'Đang gửi...') lastBot.remove();
                if (resp.ok && data) {
                    // prefer sanitized HTML returned by server
                    if (data.reply_html) {
                        const el = document.createElement('div');
                        el.className = 'bubble bot';
                        el.innerHTML = data.reply_html; // server-sanitized
                        chatBody.appendChild(el);
                        chatBody.scrollTop = chatBody.scrollHeight;
                    } else if (data.reply) {
                        appendBubble(data.reply, 'bot');
                    } else {
                        appendBubble('Lỗi: Không nhận được phản hồi từ server.', 'bot');
                    }
                } else {
                    appendBubble('Lỗi: Không nhận được phản hồi từ server.', 'bot');
                }
            } catch (e) {
                const lastBot = [...chatBody.querySelectorAll('.bubble.bot')].pop();
                if (lastBot && lastBot.textContent === 'Đang gửi...') lastBot.remove();
                appendBubble('Lỗi kết nối: ' + (e.message || e), 'bot');
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });
    </script>
