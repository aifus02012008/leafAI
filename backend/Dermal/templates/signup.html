<!doctype html>
<html lang="vi">

<head>
  <meta property="og:title" content="LEAF_AI - Phát hiện bệnh lá vải thiều Lục Ngạn bằng AI">
  <meta property="og:description"
      content="Chụp một chiếc lá vải thiều Lục Ngạn, LEAF_AI phân tích vết bệnh, cho biết mức độ nguy hiểm và gợi ý phác đồ xử lý theo hướng IPM.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/images/icon-512.png">
  <meta property="og:site_name" content="LEAF_AI - Phát hiện bệnh lá vải thiều Lục Ngạn bằng AI">

  <link rel="shortcut icon" href="/assets/images/icon-192.png" type="image/png">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Đăng ký - LEAF_AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e8f0ff 100%);
    }

    .card-signup {
      width: 380px;
      max-width: 92vw;
      border: 0;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }

    .brand {
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .hint {
      font-size: 0.9rem;
      color: #6b7280;
    }

    body {
      padding-bottom: 76px;
    }
  </style>
</head>

<body class="d-flex vh-100">
  <div class="container d-flex align-items-center justify-content-center">
    <div class="card card-signup p-4 text-center bg-white">
      <div class="mb-3">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <div class="d-flex align-items-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="#0d6efd" class="me-2"
              viewBox="0 0 16 16">
              <path
                d="M10.5 2a1 1 0 0 0-.832.445L8.94 4H7.06L6.332 2.445A1 1 0 0 0 5.5 2h-3A1.5 1.5 0 0 0 1 3.5v9A1.5 1.5 0 0 0 2.5 14h11A1.5 1.5 0 0 0 15 12.5v-9A1.5 1.5 0 0 0 13.5 2h-3zM8 12a3 3 0 1 1 0-6 3 3 0 0 1 0 6z" />
            </svg>
            <div class="brand">LEAF_AI</div>
          </div>
        </div>
        <div class="hint">Đăng ký tài khoản mới</div>
      </div>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
          <input type="email" name="email" class="form-control" placeholder="Email" value="{{ data.email|default:'' }}" required>
        </div>
        <div class="mb-3">
          <input type="text" name="username" class="form-control" placeholder="Tên đăng nhập" value="{{ data.username|default:'' }}" required>
        </div>
        <div class="mb-3">
          <input type="password" name="password" class="form-control" placeholder="Mật khẩu" required>
        </div>
        <div class="mb-3">
          <label for="avatar" class="form-label">Ảnh đại diện (tùy chọn)</label>
          <input type="file" name="avatar" id="avatar" class="form-control" accept="image/*">
        </div>
        <div class="mb-3">
          <label for="birth_date" class="form-label">Ngày sinh</label>
          <input type="date" name="birth_date" id="birth_date" class="form-control" value="{{ data.birth_date|default:'' }}" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
      </form>

      <div class="mt-3 mb-3">
      </div>


      <div class="mt-3">
        <a href="{% url 'login' %}" class="text-decoration-none">Đã có tài khoản? Đăng nhập</a>
      </div>
    </div>
  </div>

  <!-- bottom navbar copied from home.html -->
  <nav class="navbar navbar-light bg-white border-top fixed-bottom">
    <div class="container d-flex justify-content-around py-2">
      <a href="{% url 'home' %}" class="d-flex flex-column align-items-center text-decoration-none text-muted" aria-current="page">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-camera-fill"
          viewBox="0 0 16 16">
          <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0" />
          <path
            d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4zm.5 2a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1m9 2.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0" />
        </svg>
      </a>

          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chat-square-quote-fill" viewBox="0 0 16 16">
            <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.5a1 1 0 0 0-.8.4l-1.9 2.533a1 1 0 0 1-1.6 0L5.3 12.4a1 1 0 0 0-.8-.4H2a2 2 0 0 1-2-2zm7.194 2.766a1.7 1.7 0 0 0-.227-.272 1.5 1.5 0 0 0-.469-.324l-.008-.004A1.8 1.8 0 0 0 5.734 4C4.776 4 4 4.746 4 5.667c0 .92.776 1.666 1.734 1.666.343 0 .662-.095.931-.26-.137.389-.39.804-.81 1.22a.405.405 0 0 0 .011.59c.173.16.447.155.614-.01 1.334-1.329 1.37-2.758.941-3.706a2.5 2.5 0 0 0-.227-.4zM11 7.073c-.136.389-.39.804-.81 1.22a.405.405 0 0 0 .012.59c.172.16.446.155.613-.01 1.334-1.329 1.37-2.758.942-3.706a2.5 2.5 0 0 0-.228-.4 1.7 1.7 0 0 0-.227-.273 1.5 1.5 0 0 0-.469-.324l-.008-.004A1.8 1.8 0 0 0 10.07 4c-.957 0-1.734.746-1.734 1.667 0 .92.777 1.666 1.734 1.666.343 0 .662-.095.931-.26z"/>

        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="mb-1"
          viewBox="0 0 16 16">
          <path d="M2 2h12v9H5.414L3 13.414V2z" />
        </svg>
      </a>


      
      <a href="{% url 'spa_page' page='library' %}"
          class="d-flex flex-column align-items-center text-decoration-none text-muted"

          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="mb-1"

              <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1H7v12H2.5A1.5 1.5 0 0 1 1 13.5v-11zM15 2.5A1.5 1.5 0 0 0 13.5 1H9v12h4.5A1.5 1.5 0 0 0 15 13.5v-11z" />

      <a href="{% url 'your_profile' %}" class="d-flex flex-column align-items-center text-decoration-none text-muted">

          <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
          <path fill-rule="evenodd"

        </svg>
      </a>
    </div>
  </nav>
</body>

</html>
