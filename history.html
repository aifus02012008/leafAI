<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lịch sử quét — LEAF_AI</title>
  <meta name="description" content="Nhật ký các lần chẩn đoán lá cà chua, theo dõi diễn biến bệnh theo thời gian.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e7a4c">
  <link rel="icon" href="assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="assets/images/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="history">
  <script src="assets/js/core.js"></script>

  <main id="main" class="page">
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Nhật ký đồng ruộng</h1>
          <p>Mỗi lần quét được lưu lại để bạn so sánh bệnh đang lan rộng hay đã thuyên giảm sau khi xử lý.</p>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" type="button" id="btnExport"><i class="bi bi-download"></i>Tải CSV</button>
          <button class="btn btn-danger" type="button" id="btnClear"><i class="bi bi-trash3"></i>Xóa toàn bộ</button>
        </div>
      </div>

      <dl class="summary" id="summary">
        <div><dt>Tổng lượt quét</dt><dd id="sTotal">0</dd></div>
        <div><dt>Lá phát hiện bệnh</dt><dd id="sSick">0</dd></div>
        <div><dt>Bệnh gặp nhiều nhất</dt><dd id="sTop">—</dd></div>
        <div><dt>Lần quét gần nhất</dt><dd id="sLast">—</dd></div>
      </dl>

      <div class="toolbar-row">
        <div class="filter-chips" role="group" aria-label="Lọc bản ghi">
          <button class="chip" type="button" data-filter="all" aria-pressed="true">Tất cả</button>
          <button class="chip" type="button" data-filter="sick" aria-pressed="false">Có bệnh</button>
          <button class="chip" type="button" data-filter="coinf" aria-pressed="false">Đồng nhiễm</button>
          <button class="chip" type="button" data-filter="healthy" aria-pressed="false">Lá khỏe</button>
        </div>
        <span class="small muted" id="sourceNote"></span>
      </div>

      <ul class="records" id="records" aria-live="polite"></ul>
    </div>
  </main>

  <script src="assets/js/disease_data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/pages/history.js"></script>
</body>
</html>
