<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <linearGradient id="leafGrad3" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="35%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="septoriaSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#78350f"/>
      <stop offset="90%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgGrad3)" rx="12"/>
  <path d="M0 50 H400 M0 100 H400 M0 150 H400 M0 200 H400 M0 250 H400 M50 0 V300 M100 0 V300 M150 0 V300 M200 0 V300 M250 0 V300 M300 0 V300 M350 0 V300" stroke="#fef08a" stroke-width="0.8" opacity="0.6"/>

  <!-- Stem -->
  <path d="M85 260 Q135 200 190 150 T295 70" fill="none" stroke="#166534" stroke-width="5" stroke-linecap="round"/>

  <!-- Center leaflet with chlorosis / yellowing -->
  <g filter="url(#shadow3)">
    <path d="M200 145 C135 105 130 50 200 30 C270 50 265 105 200 145 Z" fill="url(#leafGrad3)"/>
    <!-- Yellowing patches -->
    <path d="M165 70 Q180 85 195 80 Q190 60 175 60 Z" fill="#fde047" opacity="0.45"/>
    <path d="M205 90 Q225 100 235 85 Q220 75 205 90 Z" fill="#fde047" opacity="0.45"/>
    <path d="M200 145 L200 35 M200 120 L165 100 M200 120 L235 100 M200 90 L160 70 M200 90 L240 70 M200 65 L170 50 M200 65 L230 50" fill="none" stroke="#166534" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- Left leaflet -->
  <g filter="url(#shadow3)">
    <path d="M145 185 C95 170 80 130 115 105 C160 115 160 155 145 185 Z" fill="url(#leafGrad3)"/>
    <path d="M145 185 Q130 145 115 105" fill="none" stroke="#166534" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- Right leaflet -->
  <g filter="url(#shadow3)">
    <path d="M255 185 C305 170 320 130 285 105 C240 115 240 155 255 185 Z" fill="url(#leafGrad3)"/>
    <path d="M255 185 Q270 145 285 105" fill="none" stroke="#166534" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- SEPTORIA SPOTS (Gray center + dark brown margin + pycnidia black dots) -->
  <!-- Spot 1 -->
  <circle cx="180" cy="70" r="10" fill="url(#septoriaSpot)"/>
  <circle cx="180" cy="70" r="10" fill="none" stroke="#451a03" stroke-width="1.5"/>
  <circle cx="178" cy="69" r="1" fill="#09090b"/>
  <circle cx="181" cy="72" r="1" fill="#09090b"/>
  <circle cx="182" cy="68" r="0.8" fill="#09090b"/>

  <!-- Spot 2 -->
  <circle cx="215" cy="85" r="9" fill="url(#septoriaSpot)"/>
  <circle cx="215" cy="85" r="9" fill="none" stroke="#451a03" stroke-width="1.5"/>
  <circle cx="214" cy="84" r="1" fill="#09090b"/>
  <circle cx="217" cy="86" r="1" fill="#09090b"/>

  <!-- Spot 3 -->
  <circle cx="195" cy="105" r="8" fill="url(#septoriaSpot)"/>
  <circle cx="195" cy="105" r="8" fill="none" stroke="#451a03" stroke-width="1.3"/>
  <circle cx="195" cy="104" r="1" fill="#09090b"/>

  <!-- Spot 4 -->
  <circle cx="170" cy="115" r="7.5" fill="url(#septoriaSpot)"/>
  <circle cx="170" cy="115" r="7.5" fill="none" stroke="#451a03" stroke-width="1.2"/>
  <circle cx="169" cy="114" r="0.9" fill="#09090b"/>

  <!-- Spot 5 on Left Leaf -->
  <circle cx="125" cy="135" r="8" fill="url(#septoriaSpot)"/>
  <circle cx="125" cy="135" r="8" fill="none" stroke="#451a03" stroke-width="1.3"/>
  <circle cx="124" cy="134" r="1" fill="#09090b"/>
  <circle cx="127" cy="136" r="0.8" fill="#09090b"/>

  <!-- Spot 6 on Right Leaf -->
  <circle cx="275" cy="140" r="8.5" fill="url(#septoriaSpot)"/>
  <circle cx="275" cy="140" r="8.5" fill="none" stroke="#451a03" stroke-width="1.3"/>
  <circle cx="274" cy="139" r="1" fill="#09090b"/>
  <circle cx="277" cy="141" r="0.9" fill="#09090b"/>

  <!-- Smaller satellite spots -->
  <circle cx="190" cy="50" r="5" fill="url(#septoriaSpot)" stroke="#451a03" stroke-width="1"/>
  <circle cx="225" cy="65" r="6" fill="url(#septoriaSpot)" stroke="#451a03" stroke-width="1"/>
  <circle cx="155" cy="95" r="5.5" fill="url(#septoriaSpot)" stroke="#451a03" stroke-width="1"/>
  <circle cx="240" cy="110" r="6" fill="url(#septoriaSpot)" stroke="#451a03" stroke-width="1"/>

  <!-- Label Badge -->
  <rect x="20" y="248" width="175" height="32" rx="16" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/>
  <circle cx="36" cy="264" r="6" fill="#eab308"/>
  <text x="50" y="269" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#854d0e">Đốm lá Septoria</text>
  <text x="380" y="269" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Septoria lycopersici</text>
</svg>
