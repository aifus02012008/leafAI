<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="leafGrad5" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="moldPatch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3f6212"/>
      <stop offset="50%" stop-color="#65a30d"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgGrad5)" rx="12"/>
  <path d="M0 50 H400 M0 100 H400 M0 150 H400 M0 200 H400 M0 250 H400 M50 0 V300 M100 0 V300 M150 0 V300 M200 0 V300 M250 0 V300 M300 0 V300 M350 0 V300" stroke="#bbf7d0" stroke-width="0.8" opacity="0.6"/>

  <!-- Stem -->
  <path d="M85 260 Q135 200 190 150 T295 70" fill="none" stroke="#166534" stroke-width="5" stroke-linecap="round"/>

  <!-- Center leaflet -->
  <g filter="url(#shadow5)">
    <path d="M200 145 C135 105 130 50 200 30 C270 50 265 105 200 145 Z" fill="url(#leafGrad5)"/>
    <path d="M200 145 L200 35 M200 120 L165 100 M200 120 L235 100 M200 90 L160 70 M200 90 L240 70 M200 65 L170 50 M200 65 L230 50" fill="none" stroke="#166534" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- Left leaflet -->
  <g filter="url(#shadow5)">
    <path d="M145 185 C95 170 80 130 115 105 C160 115 160 155 145 185 Z" fill="url(#leafGrad5)"/>
    <path d="M145 185 Q130 145 115 105" fill="none" stroke="#166534" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- Right leaflet -->
  <g filter="url(#shadow5)">
    <path d="M255 185 C305 170 320 130 285 105 C240 115 240 155 255 185 Z" fill="url(#leafGrad5)"/>
    <path d="M255 185 Q270 145 285 105" fill="none" stroke="#166534" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- LEAF MOLD VELVETY PATCHES (Mảng vàng nhạt + mốc nhung ô-liu) -->
  <ellipse cx="180" cy="70" rx="22" ry="16" fill="url(#moldPatch)" opacity="0.85"/>
  <ellipse cx="220" cy="85" rx="18" ry="14" fill="url(#moldPatch)" opacity="0.85"/>
  <ellipse cx="195" cy="110" rx="20" ry="15" fill="url(#moldPatch)" opacity="0.8"/>
  <ellipse cx="125" cy="140" rx="16" ry="12" fill="url(#moldPatch)" opacity="0.85"/>
  <ellipse cx="275" cy="145" rx="18" ry="14" fill="url(#moldPatch)" opacity="0.85"/>
  <circle cx="190" cy="50" r="10" fill="url(#moldPatch)" opacity="0.75"/>

  <!-- Velvety mold texture dots -->
  <circle cx="178" cy="68" r="1.5" fill="#365314"/>
  <circle cx="184" cy="72" r="1.2" fill="#365314"/>
  <circle cx="175" cy="74" r="1.4" fill="#365314"/>
  <circle cx="218" cy="84" r="1.3" fill="#365314"/>
  <circle cx="224" cy="87" r="1.5" fill="#365314"/>

  <!-- Label Badge -->
  <rect x="20" y="248" width="150" height="32" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="36" cy="264" r="6" fill="#10b981"/>
  <text x="50" y="269" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">Nấm mốc lá</text>
  <text x="380" y="269" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Passalora fulva</text>
</svg>
