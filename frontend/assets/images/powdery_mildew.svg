<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="leafGrad6" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="powderWhite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f8fafc" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#e2e8f0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0"/>
    </radialGradient>
    <filter id="powderBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgGrad6)" rx="12"/>
  <path d="M0 50 H400 M0 100 H400 M0 150 H400 M0 200 H400 M0 250 H400 M50 0 V300 M100 0 V300 M150 0 V300 M200 0 V300 M250 0 V300 M300 0 V300 M350 0 V300" stroke="#bae6fd" stroke-width="0.8" opacity="0.6"/>

  <!-- Stem -->
  <path d="M85 260 Q135 200 190 150 T295 70" fill="none" stroke="#047857" stroke-width="5" stroke-linecap="round"/>

  <!-- Center leaflet -->
  <g filter="url(#shadow6)">
    <path d="M200 145 C135 105 130 50 200 30 C270 50 265 105 200 145 Z" fill="url(#leafGrad6)"/>
    <path d="M200 145 L200 35 M200 120 L165 100 M200 120 L235 100 M200 90 L160 70 M200 90 L240 70 M200 65 L170 50 M200 65 L230 50" fill="none" stroke="#065f46" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- Left leaflet -->
  <g filter="url(#shadow6)">
    <path d="M145 185 C95 170 80 130 115 105 C160 115 160 155 145 185 Z" fill="url(#leafGrad6)"/>
    <path d="M145 185 Q130 145 115 105" fill="none" stroke="#065f46" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- Right leaflet -->
  <g filter="url(#shadow6)">
    <path d="M255 185 C305 170 320 130 285 105 C240 115 240 155 255 185 Z" fill="url(#leafGrad6)"/>
    <path d="M255 185 Q270 145 285 105" fill="none" stroke="#065f46" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- POWDERY MILDEW WHITE TALCUM COATINGS (Mảng bột phấn trắng phủ bề mặt) -->
  <ellipse cx="180" cy="70" rx="26" ry="18" fill="url(#powderWhite)" filter="url(#powderBlur)"/>
  <ellipse cx="225" cy="80" rx="22" ry="16" fill="url(#powderWhite)" filter="url(#powderBlur)"/>
  <ellipse cx="195" cy="105" rx="28" ry="20" fill="url(#powderWhite)" filter="url(#powderBlur)"/>
  <ellipse cx="125" cy="140" rx="20" ry="14" fill="url(#powderWhite)" filter="url(#powderBlur)"/>
  <ellipse cx="275" cy="140" rx="22" ry="16" fill="url(#powderWhite)" filter="url(#powderBlur)"/>
  <circle cx="195" cy="50" r="14" fill="url(#powderWhite)" filter="url(#powderBlur)"/>

  <!-- High-opacity dense powder centers -->
  <ellipse cx="180" cy="70" rx="14" ry="10" fill="#ffffff" opacity="0.85" filter="url(#powderBlur)"/>
  <ellipse cx="225" cy="80" rx="12" ry="8" fill="#ffffff" opacity="0.85" filter="url(#powderBlur)"/>
  <ellipse cx="195" cy="105" rx="15" ry="11" fill="#ffffff" opacity="0.85" filter="url(#powderBlur)"/>

  <!-- Label Badge -->
  <rect x="20" y="248" width="140" height="32" rx="16" fill="#ffffff" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="36" cy="264" r="6" fill="#06b6d4"/>
  <text x="50" y="269" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0e7490">Phấn trắng</text>
  <text x="380" y="269" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Leveillula taurica</text>
</svg>
