<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="targetSpot1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="25%" stop-color="#78350f"/>
      <stop offset="45%" stop-color="#9a3412"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="90%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="targetSpot2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b1300"/>
      <stop offset="30%" stop-color="#7c2d12"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#fef9c3" stop-opacity="0.1"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 50 H400 M0 100 H400 M0 150 H400 M0 200 H400 M0 250 H400 M50 0 V300 M100 0 V300 M150 0 V300 M200 0 V300 M250 0 V300 M300 0 V300 M350 0 V300" stroke="#e2e8f0" stroke-width="0.8" opacity="0.6"/>

  <!-- Tomato Main Leaf Stem -->
  <path d="M70 260 Q130 200 190 150 T310 70" fill="none" stroke="#166534" stroke-width="6" stroke-linecap="round"/>

  <!-- Main Central Tomato Leaflet -->
  <g filter="url(#shadow)">
    <path d="M200 140 C140 100 130 50 200 30 C270 50 260 100 200 140 Z" fill="url(#leafGrad)"/>
    <!-- Leaf veins -->
    <path d="M200 140 L200 40 M200 115 L170 95 M200 115 L230 95 M200 90 L165 70 M200 90 L235 70 M200 65 L175 50 M200 65 L225 50" fill="none" stroke="#14532d" stroke-width="1.8" opacity="0.7"/>
    <!-- Serrated Leaf Edge accents -->
    <path d="M165 80 Q155 75 168 70 Q160 62 175 58 Q170 48 185 45" fill="none" stroke="#15803d" stroke-width="2"/>
    <path d="M235 80 Q245 75 232 70 Q240 62 225 58 Q230 48 215 45" fill="none" stroke="#15803d" stroke-width="2"/>
  </g>

  <!-- Left Leaflet -->
  <g filter="url(#shadow)">
    <path d="M150 180 C100 170 80 130 115 105 C160 115 165 150 150 180 Z" fill="url(#leafGrad)"/>
    <path d="M150 180 Q130 140 115 105" fill="none" stroke="#14532d" stroke-width="1.8" opacity="0.7"/>
    <path d="M138 155 L115 145 M132 135 L110 125" fill="none" stroke="#14532d" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- Right Leaflet -->
  <g filter="url(#shadow)">
    <path d="M250 180 C300 170 320 130 285 105 C240 115 235 150 250 180 Z" fill="url(#leafGrad)"/>
    <path d="M250 180 Q270 140 285 105" fill="none" stroke="#14532d" stroke-width="1.8" opacity="0.7"/>
    <path d="M262 155 L285 145 M268 135 L290 125" fill="none" stroke="#14532d" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- EARLY BLIGHT CONCENTRIC RING LESIONS (VÂN ĐỒNG TÂM - ĐỐM VÒNG) -->
  <!-- Spot 1 on Center Leaf -->
  <circle cx="195" cy="80" r="22" fill="url(#targetSpot1)"/>
  <circle cx="195" cy="80" r="16" fill="none" stroke="#451a03" stroke-width="1.5" stroke-dasharray="2 1"/>
  <circle cx="195" cy="80" r="10" fill="none" stroke="#78350f" stroke-width="1.5"/>
  <circle cx="195" cy="80" r="4" fill="#270901"/>

  <!-- Spot 2 on Left Leaflet -->
  <circle cx="125" cy="135" r="18" fill="url(#targetSpot2)"/>
  <circle cx="125" cy="135" r="13" fill="none" stroke="#451a03" stroke-width="1.3"/>
  <circle cx="125" cy="135" r="8" fill="none" stroke="#78350f" stroke-width="1.2"/>
  <circle cx="125" cy="135" r="3" fill="#1f0700"/>

  <!-- Spot 3 on Right Leaflet -->
  <circle cx="275" cy="140" r="15" fill="url(#targetSpot1)"/>
  <circle cx="275" cy="140" r="10" fill="none" stroke="#451a03" stroke-width="1.2"/>
  <circle cx="275" cy="140" r="5" fill="none" stroke="#78350f" stroke-width="1"/>

  <!-- Minor satellite spots -->
  <circle cx="180" cy="55" r="6" fill="#9a3412" opacity="0.9"/>
  <circle cx="178" cy="115" r="8" fill="#9a3412" opacity="0.85"/>
  <circle cx="215" cy="105" r="7" fill="#78350f" opacity="0.85"/>

  <!-- Label Badge -->
  <rect x="20" y="248" width="170" height="32" rx="16" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/>
  <circle cx="36" cy="264" r="6" fill="#f97316"/>
  <text x="50" y="269" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9a3412">Úa sớm (Đốm vòng)</text>
  <text x="380" y="269" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Alternaria solani</text>
</svg>
