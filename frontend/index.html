<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LEAF_AI — Nhận diện bệnh lá vải thiều Lục Ngạn bằng AI</title>
  <meta name="description" content="Chụp một lá vải thiều, LEAF_AI nhận diện bệnh hại, chỉ cách xử lý theo hướng IPM và có kỹ sư AI trả lời thắc mắc.">
  <meta property="og:title" content="LEAF_AI — Nhận diện bệnh lá vải thiều Lục Ngạn bằng AI">
  <meta property="og:description" content="Nhận diện bệnh trên lá vải, xem vùng lá AI dựa vào và nhận phác đồ IPM ngay tại vườn.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e7a4c">
  <link rel="icon" href="assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="assets/images/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">
  <script src="assets/js/core.js"></script>

  <main id="main">
    <section class="hero hero-lite">
      <div class="container hero-grid">
        <div>
          <span class="hero-kicker"><i class="bi bi-geo-alt"></i>Vải thiều Lục Ngạn</span>
          <h1>Chụp một lá vải. Biết ngay bệnh gì.</h1>
          <p class="hero-lead">AI nhận diện 5 bệnh hại trên lá vải và chỉ cách xử lý. Còn thắc mắc, kỹ sư AI trả lời ngay.</p>
          <div class="hero-actions">
            <a class="btn btn-primary btn-lg" href="scan.html"><i class="bi bi-camera"></i>Quét lá ngay</a>
            <button class="btn btn-lg" type="button" id="btnHeroChat"><i class="bi bi-chat-dots"></i>Hỏi kỹ sư AI</button>
          </div>
          <ol class="mini-steps" aria-label="Cách dùng">
            <li><b>1</b>Chụp lá</li>
            <li><b>2</b>AI chẩn đoán</li>
            <li><b>3</b>Xử lý theo hướng dẫn</li>
          </ol>
        </div>

        <figure class="demo" aria-label="Minh họa: AI nhận diện bệnh thán thư trên lá vải và tô vùng AI chú ý" style="margin:0">
          <div class="demo-bar">
            <span class="demo-live"><strong>Ví dụ kết quả</strong><span class="demo-sub">ảnh minh họa</span></span>
            <button class="btn btn-ghost btn-sm" id="btnReplay" type="button"><i class="bi bi-arrow-repeat"></i>Xem lại</button>
          </div>
          <div class="demo-stage" id="demoStage">
            <img src="assets/samples/sample_anthracnose.jpg" alt="Lá vải có các vết nâu ở chóp và mép lá chét" width="800" height="600">
            <img class="demo-cam" src="assets/samples/cam_anthracnose.jpg" alt="" width="800" height="600">
            <span class="demo-chip"><i class="bi bi-fire"></i>Vùng AI chú ý</span>
            <div class="demo-scanline" aria-hidden="true"></div>
          </div>
          <figcaption class="demo-result">
            <div>
              <div class="name">Thán thư</div>
              <div class="meta">Cắt bỏ lộc, lá bệnh và tỉa tán cho thoáng trước khi tính đến thuốc.</div>
            </div>
            <div class="demo-score">91%</div>
          </figcaption>
        </figure>
      </div>
    </section>

    <div class="strip">
      <div class="container strip-inner">
        <span class="strip-label">5 bệnh AI nhận diện</span>
        <a href="disease.html?id=anthracnose"><span class="dot" style="--dot:#c2410c"></span>Thán thư</a>
        <a href="disease.html?id=downy_blight"><span class="dot" style="--dot:#dc2626"></span>Sương mai</a>
        <a href="disease.html?id=leaf_blight"><span class="dot" style="--dot:#a16207"></span>Cháy lá</a>
        <a href="disease.html?id=algal_spot"><span class="dot" style="--dot:#0e7490"></span>Đốm rong</a>
        <a href="disease.html?id=erinose"><span class="dot" style="--dot:#7e22ce"></span>Nhện lông nhung</a>
      </div>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/pages/landing.js"></script>
</body>
</html>
