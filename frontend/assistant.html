<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trợ lý kỹ sư AI — LEAF_AI</title>
  <meta name="description" content="Hỏi đáp về bệnh cà chua, phác đồ xử lý và kỹ thuật canh tác IPM bằng tiếng Việt.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e7a4c">
  <link rel="icon" href="assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="assets/images/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="assistant">
  <script src="assets/js/core.js"></script>

  <main id="main" class="page">
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Trợ lý kỹ sư nông nghiệp</h1>
          <p>Mô tả triệu chứng bằng lời của bạn, hỏi về liều lượng, thời gian cách ly hay cách ủ phân vi sinh.</p>
        </div>
        <button class="btn btn-ghost" type="button" id="btnNewChat"><i class="bi bi-plus-lg"></i>Cuộc trò chuyện mới</button>
      </div>

      <div class="chat-layout">
        <section class="panel chat" aria-label="Cuộc trò chuyện">
          <div class="chat-thread" id="thread" aria-live="polite"></div>
          <form class="composer" id="composer">
            <label class="visually-hidden" for="chatInput">Câu hỏi của bạn</label>
            <textarea id="chatInput" rows="1" placeholder="Ví dụ: lá dưới gốc có đốm nâu viền vàng, là bệnh gì?" maxlength="4000"></textarea>
            <button class="btn btn-primary" type="submit" id="btnSend" aria-label="Gửi"><i class="bi bi-send"></i><span>Gửi</span></button>
          </form>
        </section>

        <aside class="chat-side">
          <div class="panel panel-pad">
            <h2 style="font-size:var(--fs-base);margin-bottom:12px">Câu hỏi thường gặp</h2>
            <div class="suggest">
              <button type="button">Lá cà chua bị đốm tròn có quầng vàng là bệnh gì?</button>
              <button type="button">Khi nào nên phun gốc đồng kết hợp Kasugamycin trị đốm vi khuẩn?</button>
              <button type="button">Thời gian cách ly (PHI) của thuốc BVTV trước khi thu hoạch là bao lâu?</button>
              <button type="button">Cách ủ phân hữu cơ với nấm Trichoderma để ngừa nấm gốc?</button>
              <button type="button">Trời mưa phùn, lạnh kéo dài thì cần phòng bệnh sương mai thế nào?</button>
            </div>
            <p class="small muted" style="margin-top:16px">Câu trả lời mang tính tham khảo. Với ổ dịch lớn, hãy liên hệ trạm bảo vệ thực vật địa phương.</p>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script src="assets/js/disease_data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/pages/assistant.js"></script>
</body>
</html>
