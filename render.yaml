# Render.com Blueprint Deployment Configuration for LEAF_AI
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: leaf-ai-engine
    env: docker
    plan: free
    region: singapore # hoặc oregon, ohio, frankfurt
    rootDir: ml/hf-space
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 7860
      - key: TORCH_THREADS
        value: 2
      # URL checkpoint mô hình LÁ VẢI (lychee_model.pt) sau khi train bằng ml/training/train_lychee.py
      # và upload lên Hugging Face, vd: https://huggingface.co/<user>/leaf-ai-lychee-model/resolve/main/lychee_model.pt
      # Đặt giá trị trong Render Dashboard → Environment (sync: false). Mô hình cà chua cũ sẽ bị máy chủ từ chối.
      - key: MODEL_DOWNLOAD_URL
        sync: false
