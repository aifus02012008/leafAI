# Durian leaf disease classifier (YOLO11s-cls). Test accuracy 0.897, macro-F1 0.898 (run 2026-11-23).
# Dataset: "A Durian Leaf Image Dataset of Common Diseases in Vietnam for Agricultural Diagnosis",
# Mendeley Data, DOI 10.17632/pxzvksbwnj.5, licence CC BY 4.0.
crop: durian
task: classify
data: datasets/durian/cls          # train/ val/ test/ <class>/*.jpg
base_model: yolo11s-cls.pt
imgsz: 288
epochs: 100
patience: 30
batch: 48
seed: 42
# Field-photo augmentation: lighting/colour shifts, tilt, flips, crops and erasing for clutter.
augment:
  hsv_h: 0.02
  hsv_s: 0.5
  hsv_v: 0.4
  mixup: 0.0
  degrees: 25
  translate: 0.1
  scale: 0.4
  fliplr: 0.5
  flipud: 0.3
  erasing: 0.25
  auto_augment: randaugment
output: model/durian.pt
